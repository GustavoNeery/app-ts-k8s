replicaCount: 3

namespace: app

restartPodWithConfig: true

appConfigEnv:
  APP: lula-nery
  REVISAO: estou-revisando
  ENV: staging

appSecretEnv:
  API_KEY: c2tkajEzaTI0dTg5ZGhmZDIwCg==

image:
  repository: gustavoneery/app-ts
  pullPolicy: IfNotPresent
  containerPort: "3000"
  tag: "e784dc7"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false

ingress:
  enabled: false

httpRoute:
  enabled: false

podSecurityContext:
  runAsUser: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 192Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: 3000
  failureThreshold: 2
  successThreshold: 1
  periodSeconds: 10
  initialDelaySeconds: 5
readinessProbe:
  httpGet:
    path: /readyz
    port: 3000
  failureThreshold: 3
  successThreshold: 1
  timeoutSeconds: 1
  periodSeconds: 15
  initialDelaySeconds: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
